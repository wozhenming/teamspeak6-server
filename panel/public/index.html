<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeamSpeak 6 管理面板</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M4 15.5 8 7l3 5 2-3 3 4 4-7 0 9.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="4" cy="15.5" r="1.4" fill="currentColor" stroke="none"/>
        <circle cx="8" cy="7" r="1.4" fill="currentColor" stroke="none"/>
        <circle cx="12" cy="9" r="1.4" fill="currentColor" stroke="none"/>
        <circle cx="15" cy="12" r="1.4" fill="currentColor" stroke="none"/>
        <circle cx="20" cy="7" r="1.4" fill="currentColor" stroke="none"/>
      </svg>
      <span>TS6 管理面板</span>
      <button class="sidebar-close" id="sidebar-close"
        onclick="var s=document.getElementById('sidebar'),o=document.getElementById('sidebar-overlay');s.classList.remove('open');s.style.transform='';o.classList.remove('active');setTimeout(resizeAllCharts,300);setTimeout(resizeAllCharts,550)"
        title="关闭侧边栏">&times;</button>
    </div>
    <nav class="sidebar-nav">
      <a href="#/deploy" data-page="deploy">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4.5 16.5c-1.5 1.3-2 5-2 5s3.7-.5 5-2c.7-.8.7-2 0-2.8-.8-.7-2.2-.7-3 .8z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg>
        部署管理
      </a>
      <a href="#/dashboard" data-page="dashboard" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        仪表盘
      </a>
      <a href="#/users" data-page="users">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.6"/><path d="M16 14.2c2.8.3 5 2.5 5 5.8"/></svg>
        用户管理
      </a>
      <a href="#/channels" data-page="channels">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="14" width="18" height="7" rx="1.5"/></svg>
        频道管理
      </a>
      <a href="#/stats" data-page="stats">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
        数据统计
      </a>
      <a href="#/music" data-page="music">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        点歌
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="conn-status" id="conn-status" title="TeamSpeak 服务器连接状态">
        <span class="dot"></span><span id="conn-status-text">检测中…</span>
      </div>
      <button class="btn btn-ghost btn-block" id="logout-btn">退出登录</button>
    </div>
  </aside>

  <!-- 移动端侧边栏遮罩 -->
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="var s=document.getElementById('sidebar'),m=document.getElementById('main');s.classList.remove('open');s.style.transform='';if(window.innerWidth>1024)m.style.marginLeft='';this.classList.remove('active');setTimeout(resizeAllCharts,300);setTimeout(resizeAllCharts,550)"></div>

  <main class="main" id="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="btn btn-sm menu-toggle" id="menu-toggle" title="菜单"
          onclick="var s=document.getElementById('sidebar'),m=document.getElementById('main'),o=document.getElementById('sidebar-overlay'),w=window.innerWidth>1024;s.classList.toggle('open');o.classList.toggle('active');if(s.classList.contains('open')){s.style.transform='translateX(0)';if(w)m.style.marginLeft='220px'}else{s.style.transform=w?'translateX(-220px)':'translateX(-100%)';if(w)m.style.marginLeft='0'}setTimeout(resizeAllCharts,300);setTimeout(resizeAllCharts,550)">>
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <h2 id="page-title">仪表盘</h2>
      </div>
      <div class="topbar-right">
        <button class="btn btn-sm" id="theme-toggle" title="切换主题"></button>
        <span id="current-user" class="muted"></span>
        <select id="server-select" class="select" title="选择虚拟服务器" hidden></select>
      </div>
    </header>
    <section id="page-content" class="page-content"></section>
  </main>

  <div id="toast-container"></div>

  <!-- 通用模态框 -->
  <div class="modal-overlay" id="modal-overlay" hidden>
    <div class="modal" id="modal">
      <div class="modal-header">
        <h3 id="modal-title"></h3>
        <button class="modal-close" id="modal-close">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/deploy.js"></script>
  <script src="/js/dashboard.js"></script>
  <script src="/js/users.js"></script>
  <script src="/js/channels.js"></script>
  <script src="/js/stats.js"></script>
  <script src="/js/music.js"></script>
</body>
</html>
