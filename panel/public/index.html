<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeamSpeak 6 管理面板</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-brand">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M4 15.5 8 7l3 5 2-3 3 4 4-7 0 9.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="4" cy="15.5" r="1.4" fill="currentColor" stroke="none"/>
        <circle cx="8" cy="7" r="1.4" fill="currentColor" stroke="none"/>
        <circle cx="12" cy="9" r="1.4" fill="currentColor" stroke="none"/>
        <circle cx="15" cy="12" r="1.4" fill="currentColor" stroke="none"/>
        <circle cx="20" cy="7" r="1.4" fill="currentColor" stroke="none"/>
      </svg>
      <span>TS6 管理面板</span>
    </div>
    <nav class="sidebar-nav">
      <a href="#/dashboard" data-page="dashboard" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        仪表盘
      </a>
      <a href="#/users" data-page="users">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.6"/><path d="M16 14.2c2.8.3 5 2.5 5 5.8"/></svg>
        用户管理
      </a>
      <a href="#/channels" data-page="channels">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="14" width="18" height="7" rx="1.5"/></svg>
        频道管理
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="conn-status" id="conn-status" title="TeamSpeak 服务器连接状态">
        <span class="dot"></span><span id="conn-status-text">检测中…</span>
      </div>
      <button class="btn btn-ghost btn-block" id="logout-btn">退出登录</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <h2 id="page-title">仪表盘</h2>
      <div class="topbar-right">
        <span id="current-user" class="muted"></span>
        <select id="server-select" class="select" title="选择虚拟服务器" hidden></select>
      </div>
    </header>
    <section id="page-content" class="page-content"></section>
  </main>

  <div id="toast-container"></div>

  <!-- 通用模态框 -->
  <div class="modal-overlay" id="modal-overlay" hidden>
    <div class="modal" id="modal">
      <div class="modal-header">
        <h3 id="modal-title"></h3>
        <button class="modal-close" id="modal-close">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/dashboard.js"></script>
  <script src="/js/users.js"></script>
  <script src="/js/channels.js"></script>
</body>
</html>
