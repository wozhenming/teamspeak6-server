<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · TeamSpeak 6 管理面板</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-logo">
      <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M4 15.5 8 7l3 5 2-3 3 4 4-7 0 9.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="4" cy="15.5" r="1.4" fill="currentColor" stroke="none"/>
        <circle cx="8" cy="7" r="1.4" fill="currentColor" stroke="none"/>
        <circle cx="12" cy="9" r="1.4" fill="currentColor" stroke="none"/>
        <circle cx="15" cy="12" r="1.4" fill="currentColor" stroke="none"/>
        <circle cx="20" cy="7" r="1.4" fill="currentColor" stroke="none"/>
      </svg>
      <h1>TeamSpeak 6 管理面板</h1>
      <p>WebQuery 服务端管理</p>
    </div>
    <form id="login-form" autocomplete="off">
      <label>用户名
        <input type="text" id="login-username" name="username" required autofocus>
      </label>
      <label>密码
        <input type="password" id="login-password" name="password" required>
      </label>
      <div id="login-error" class="form-error" hidden></div>
      <button type="submit" class="btn btn-primary btn-block">登 录</button>
    </form>
  </div>
  <script src="/js/api.js"></script>
  <script>
    (function () {
      // 应用已保存的主题
      document.documentElement.dataset.theme = localStorage.getItem('ts6-theme') || 'dark';
      // 已登录则直接进入面板
      API.me().then(function () { location.href = '/'; }).catch(function () {});
      document.getElementById('login-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        var err = document.getElementById('login-error');
        err.hidden = true;
        try {
          await API.login(
            document.getElementById('login-username').value.trim(),
            document.getElementById('login-password').value
          );
          location.href = '/';
        } catch (ex) {
          err.textContent = ex.message || '登录失败';
          err.hidden = false;
        }
      });
    })();
  </script>
</body>
</html>
