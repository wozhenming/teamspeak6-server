# ============================================================================
# TeamSpeak 6 全栈一键部署：TS6 服务器 + Web 管理面板
#
# 用法：
#   docker compose up -d          # 一键启动全部服务
#   docker compose logs -f panel  # 查看面板日志
#   docker compose down           # 停止（保留数据卷）
#
# 可选配置：复制 .env.example 为 .env 后按需修改（面板密码、端口等）。
# 首次部署：打开 http://<主机>:3000 → 「部署管理」页查看初始凭证并配置 API Key。
# ============================================================================

services:
  # ---------- TeamSpeak 6 服务器 ----------
  teamspeak:
    image: teamspeaksystems/teamspeak6-server:latest
    container_name: teamspeak-server
    restart: unless-stopped
    ports:
      - "${TS_PORT_VOICE:-9987}:9987/udp"      # 语音端口（必须）
      - "${TS_PORT_FILE:-30033}:30033/tcp"     # 文件传输端口
      - "127.0.0.1:${TS_PORT_WEBQUERY:-10080}:10080/tcp"  # WebQuery HTTP API（面板经内网访问；如需远程管理去掉 127.0.0.1:）
      - "${TS_PORT_SSHQUERY:-10022}:10022/tcp" # SSH Query（生成 API Key 用；可改为 127.0.0.1: 仅本机）
    environment:
      - TSSERVER_LICENSE_ACCEPTED=${TS_LICENSE_ACCEPTED:-accept}
      - TSSERVER_QUERY_HTTP_ENABLED=true   # 启用 WebQuery HTTP API（管理面板必需，默认禁用）
      - TSSERVER_QUERY_SSH_ENABLED=true    # 启用 SSH Query（API Key 生成必需，默认禁用）
      - TSSERVER_QUERY_ALLOW_LIST=/etc/tsserver/query_ip_allowlist.txt  # Query 接口 IP 白名单
      # ⚠️ 远程连接 SSH Query 时，记得把来源 IP 加入 query_ip_allowlist.txt 并重启 teamspeak 容器
      # 覆盖默认 Query 管理员密码（忘记密码时设置此项即可重置，见 .env 的 TS_QUERY_ADMIN_PASSWORD）：
      - TSSERVER_QUERY_ADMIN_PASSWORD=${TS_QUERY_ADMIN_PASSWORD:-}
    volumes:
      - teamspeak-data:/var/tsserver/
      - ./query_ip_allowlist.txt:/etc/tsserver/query_ip_allowlist.txt:ro
    networks:
      - ts6

  # ---------- Web 管理面板 ----------
  panel:
    build: ./panel
    image: ts6-panel:local
    pull_policy: never              # 只使用本地构建产物，不从 registry 拉取（避免镜像源 403）
    container_name: ts6-panel
    restart: unless-stopped
    ports:
      - "${PANEL_PORT:-3000}:3000"             # 管理面板
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - PANEL_USERNAME=${PANEL_USERNAME:-admin}
      - PANEL_PASSWORD=${PANEL_PASSWORD:-admin123}   # ⚠️ 生产环境务必通过 .env 修改
      - SESSION_SECRET=${SESSION_SECRET:-please-change-me}
      - TSSERVER_BASE_URL=http://teamspeak:10080      # 容器网络内访问 TS6 WebQuery
      - TSSERVER_API_KEY=${TS_API_KEY:-${TSSERVER_API_KEY:-}}        # 与音乐机器人共用 TS WebQuery Key（也可在「部署管理」页填写）
      - TSSERVER_CONTAINER_NAME=teamspeak-server
      - PANEL_RUN_MODE=container               # 容器化模式：部署页操作/日志对接主机 Docker
      - PANEL_ENV_FILE=/app/config/panel.env   # API Key 等配置持久化位置
      - MUSIC_BASE_URL=http://music:3200        # 点歌机器人（后端代理）
    volumes:
      - panel-config:/app/config               # 持久化面板配置（API Key 等）
      - /var/run/docker.sock:/var/run/docker.sock   # 读取 TS6 容器日志/凭证、快捷启停
    depends_on:
      - teamspeak
    networks:
      - ts6

  # ---------- 网易云音乐 API（api-enhanced，点歌机器人歌曲来源） ----------
  neteasemusic:
    build:
      context: .
      dockerfile: music/api-enhanced.Dockerfile
    container_name: neteasemusic
    restart: unless-stopped
    environment:
      - PORT=3000                      # 仅内网，不暴露宿主端口
      # 数据持久化（匿名 token / 缓存）
      - NCMAPI_CONFIG=/app/data/config.json
      - NCMAPI_COOKIE=/app/data/cookie
    volumes:
      - neteasemusic-data:/app/data
      - neteasemusic-data:/tmp     # 匿名 token 与 xeapi public key 写在 /tmp，持久化避免每次重建都重新引导
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    # 图片代理端口（仅内网，供 music-bot 抓取网易云封面，借本容器外网出口）
    expose:
      - "3100"
    networks:
      - ts6

  # ---------- 点歌机器人（music-bot） ----------
  music:
    build: ./music
    container_name: ts6-music-bot
    restart: unless-stopped
    environment:
      - MUSIC_HOST=0.0.0.0
      - MUSIC_BOT_PORT=3200
      - NCMAPI_BASE=http://neteasemusic:3000   # api-enhanced 内网地址
      - NETEASE_IMG_PROXY=http://neteasemusic:3100   # 经 neteasemusic 容器出口抓取封面（其有外网）
      - MUSIC_DATA_DIR=/app/data
      # ts6-manager 对接（点歌机器人进入 TeamSpeak）。以下均有默认值，开箱即用，
      # 面板只需填写“频道”。如默认值不合用，改这里覆盖即可。
      - TS6MGR_URL=${TS6MGR_URL:-}
      - TS6MGR_USER=${TS6MGR_USER:-}
      - TS6MGR_PASS=${TS6MGR_PASS:-}
      - TS6MGR_BOT_ID=${TS6MGR_BOT_ID:-}
      - TS6MGR_CHANNEL=${TS6MGR_CHANNEL:-}
      # 电台音频流对外地址：ts6-manager 的 SSRF 防护会拒绝内网主机名（如 music），
      # 故必须填“对 ts6-manager 可达且非内网”的地址（通常是服务器公网 IP/域名）。
      # 例：STREAM_PUBLIC_HOST=8.134.136.98 → http://8.134.136.98:3200/api/stream
      # 也可直接给完整地址覆盖：STREAM_PUBLIC_URL=http://your.domain:3200/api/stream
      - STREAM_PUBLIC_URL=${STREAM_PUBLIC_URL:-}
      - STREAM_PUBLIC_HOST=${STREAM_PUBLIC_HOST:-}
      - STREAM_TOKEN=${STREAM_TOKEN:-ts6bot}
      - MUSIC_STREAM_PORT=${MUSIC_STREAM_PORT:-3200}
      # TeamSpeak 连接（自动建连）。TS_API_KEY 与面板共用；如留空则需在 .env 配置。
      - TS_HOST=${TS_HOST:-teamspeak}
      - TS_WEBQUERY_PORT=${TS_WEBQUERY_PORT:-10080}
      - TS_API_KEY=${TS_API_KEY:-}
      # 可选：设置后可用于首次自动生成 TS API Key（无需手动 apikeyadd）
      - TS_QUERY_ADMIN_PASSWORD=${TS_QUERY_ADMIN_PASSWORD:-}
    volumes:
      - music-data:/app/data               # 持久化网易云 cookie 与点歌队列
    ports:
      - "${MUSIC_STREAM_PORT:-3200}:3200"   # 电台流（ts6-manager 经公网地址拉流；配合 STREAM_TOKEN 防随意收听）
    depends_on:
      neteasemusic:
        condition: service_healthy
    networks:
      - ts6

  # ---------- ts6-manager（点歌机器人的语音引擎，复用其音乐机器人） ----------
  # 它作为真实语音客户端加入 TS 频道，把音频推流进频道。连接信息在 ts6-manager
  # 管理界面（默认 http://<主机>:3002）的 Settings → Connections 中填写：
  #   Host = teamspeak，WebQuery 端口 = 10080，API Key = 与面板相同的 WebQuery Key。
  # 注意：后端服务名必须是 backend（前端镜像的 nginx 反代上游写死为 backend）。
  backend:
    image: clusterzx/ts6-manager:backend
    container_name: ts6-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=file:/app/packages/backend/data/ts6webui.db
      - JWT_SECRET=${TS6MGR_JWT_SECRET:-change-me-ts6mgr}
      - ENCRYPTION_KEY=${TS6MGR_ENCRYPTION_KEY:-}
      - TS_ALLOW_SELF_SIGNED=${TS6MGR_ALLOW_SELF_SIGNED:-false}
      - JWT_ACCESS_EXPIRY=15m
      - JWT_REFRESH_EXPIRY=7d
      - FRONTEND_URL=${TS6MGR_FRONTEND_URL:-http://localhost:3002}
      - MUSIC_DIR=/data/music
      - SIDECAR_URL=http://ts6mgr-sidecar:9800
    volumes:
      - ts6mgr-data:/app/packages/backend/data
      - ts6mgr-music:/data/music
    depends_on:
      - ts6mgr-sidecar
      - teamspeak
    networks:
      - ts6

  ts6mgr-sidecar:
    image: clusterzx/ts6-manager:sidecar
    container_name: ts6mgr-sidecar
    restart: unless-stopped
    environment:
      - SIDECAR_PORT=9800
    networks:
      - ts6

  ts6mgr-frontend:
    image: clusterzx/ts6-manager:frontend
    container_name: ts6mgr-frontend
    restart: unless-stopped
    ports:
      - "${TS6MGR_PORT:-3002}:80"
    depends_on:
      - backend
    networks:
      - ts6

volumes:
  teamspeak-data:
  panel-config:
  neteasemusic-data:
  music-data:
  ts6mgr-data:
  ts6mgr-music:

networks:
  ts6:
